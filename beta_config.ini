[HEADER]
#this is the original input file, the one coming from the digitizer without tracker positions
original_input_filename=/media/tb_pc/9adef8c7-73d8-4f38-9709-6a1b0ca4f5bf/TB8_transfer/raw/run_100/W3_A6_DC11_270V_Run108.root
input_filename=/media/tb_pc/9adef8c7-73d8-4f38-9709-6a1b0ca4f5bf/TB8_transfer/raw/run_100/W3_A6_DC11_270V_Run108_tracksDUT.root
output_filename=/media/tb_pc/9adef8c7-73d8-4f38-9709-6a1b0ca4f5bf/TB8_transfer/raw/run_100/stats_W3_A6_DC11_270V_Run108_tracksDUT.root


[CHANNELS]
active_channels=16
# trigger and/or time reference channel
# run 100: 8
# run 300/400: 7
# run 600: 14
ch_mcp = 8

[RANGES]
# if ==1, the signals are searched in the interval defined by pmax_search_range
search_range=1
pmax_search_range_min=10
pmax_search_range_max=190
# if ==1, the signals are searched in a time window centered around the channel that recorded the highest signal. The signals of ch_mcp are excluded from this type of search. The time interval of small_range is defined as +/- small_range_interval
small_range=0
# if ==1, the signals are searched in a time window centered around the peak time of ch_mcp; the time interval is defined as +/- mcp_range_interval. Note: either set small_range or mcp_range to 1.
mcp_range=1
small_range_interval = 1
# default mcp_range_interval : 1.5
mcp_range_interval = 2

[PARAMETERS]
# max number of samples to be used in the gaus fit used to compute the Pmax. Default is 7. Ther algorithm tries this value, if it fails, it tries with number_points_gaus_fit-2; if it is still failing, take the max sampled values and set the chi2 to -10000 
number_points_gaus_fit=7
# ==1 when using the digitizer. The conversion factor is used for ADC --> V. The temporal bin width is the sampled time interval of the digitizer in ns (default 0.2 ns) 
ADC_conversion=1
ADC_conversion_factor=0.25
temporal_bin_width=0.2
# =1 gives signals in mV; adjust accordingly if you want a different value
voltage_scalar=1
# =1 gives signals in ns; adjust accordingly if you want a different value
time_scalar=1
sampling_points=1020
# the first n_points_baseline are used to compute the RMS noise ans baseline subtraction
n_points_baseline=20
tot_rising=5
tot_falling=5
# temporal distance between DUT and MCP/ trigger/ time reference
# run 100: 3.5
# run 400: 2.8
# run 600: 3.5
mcp_delay=3.5


[TRACKER]
# if you are adding tracker position to the final root file 
join_txt_tracker = 1
# if tracker position are taken from an txt/csv file
tracker_filename=/media/tb_pc/9adef8c7-73d8-4f38-9709-6a1b0ca4f5bf/TB8_transfer/raw/run_100/tracks_108.csv


